<main>
  <h1>白話詞彙表</h1>
  <p class="lead">理專或說明書上的專有名詞，這裡用一兩句白話說清楚。全站畫虛線的詞，滑過或點一下也會跳出解釋。</p>
  <label for="g-search" class="small muted">搜尋詞彙</label>
  <input id="g-search" type="search" placeholder="例如：敲入、保本、費用" autocomplete="off">

<script type="module" src="assets/site.js"></script>
<script type="module">
import glossary, { categories } from "./assets/glossary.js";

const box = document.getElementById("glossary");
const search = document.getElementById("g-search");
const empty = document.getElementById("g-empty");
const sections = [];

for (const [key, label] of Object.entries(categories)) {
  const terms = Object.entries(glossary).filter(([, e]) => (e.cat || "other") === key);
  if (!terms.length) continue;
  const sec = document.createElement("section");
  const h = document.createElement("h2");
  h.textContent = label;
  const dl = document.createElement("dl");
  dl.className = "glossary-list";
  for (const [term, e] of terms) {
    const dt = document.createElement("dt");
    dt.id = term;
    dt.textContent = term;
    const dd = document.createElement("dd");
    const p = document.createElement("p");
    p.textContent = e.short;
    dd.append(p);
    if (e.long) {
      const p2 = document.createElement("p");
      p2.className = "muted";
      p2.textContent = e.long;
      dd.append(p2);
    }
    if (e.see) {
      const a = document.createElement("a");
      a.href = e.see;
      a.textContent = "延伸閱讀 →";
      dd.append(a);
    }
    dl.append(dt, dd);
    sections.push({ sec, dt, dd, text: (term + e.short + (e.long || "")).toLowerCase() });
  }
  sec.append(h, dl);
  box.append(sec);
}

search.addEventListener("input", () => {
  const q = search.value.trim().toLowerCase();
  let shown = 0;
  for (const s of sections) {
    const hit = !q || s.text.includes(q);
    s.dt.hidden = s.dd.hidden = !hit;
    if (hit) shown++;
  }
  for (const sec of box.querySelectorAll("section")) {
    sec.hidden = ![...sec.querySelectorAll("dt")].some((dt) => !dt.hidden);
  }
  empty.hidden = shown > 0;
});

if (location.hash) {
  const el = document.getElementById(decodeURIComponent(location.hash.slice(1)));
  if (el) { el.scrollIntoView(); el.classList.add("hit"); }
}
</script>
<style>
.glossary-list { margin: 0; }
.glossary-list dt { font-family: var(--sans); font-weight: 700; font-size: 1.15rem; margin-top: 1em; scroll-margin-top: 80px; }
.glossary-list dt.hit { color: var(--seal); }
.glossary-list dd { margin: 2px 0 0; padding-left: 0; }
.glossary-list dd p { margin: 0 0 4px; }
#g-search { font: inherit; width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 0; background: var(--paper); color: var(--ink); /* taste-skill-ignore: form field */ }
</style>
